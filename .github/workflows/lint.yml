# Keeps backend/app free of unused imports and variables. The legacy re-export
# facades under backend/app/repositories/db are intentionally excluded.
name: Lint

on:
  push:
    paths: ["backend/**", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/lint.yml"]

permissions:
  contents: read

jobs:
  ruff-unused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check unused imports and variables
        run: |
          pipx run --spec ruff==0.16.10 ruff check backend/app --select F401,F841 --extend-exclude backend/app/repositories/db
