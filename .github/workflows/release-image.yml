# Multi-architecture GHCR release built natively on one runner per platform.
# See AGENTS.md ("Multi-Architecture GHCR Release").
#
# Each build job runs the matching release-<arch> bake target from
# docker-bake.hcl: the image is pushed straight from BuildKit by digest (no tag,
# no local tarball) and the per-platform registry cache is refreshed. The
# publish job then assembles ${IMAGE}:${TAG} from the two digests and moves
# ${IMAGE}:latest onto it. Creating the GitHub Release stays manual (AGENTS.md,
# "GitHub Release Publication").
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/z1rconium/gpt-image-linux

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      # Let both native builds report their own failure; cancelling the other
      # architecture hides the actionable CI error and leaves no digest.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        run: |
          tag=$(tr -d '\n' < VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::git tag $GITHUB_REF_NAME does not match VERSION ($tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VCS_REF: ${{ github.sha }}
        run: |
          docker buildx bake --progress=plain --metadata-file "$RUNNER_TEMP/bake-metadata.json" \
            "release-${{ matrix.arch }}"

      - name: Export digest
        run: |
          digest=$(jq -r '.["release-${{ matrix.arch }}"]["containerimage.digest"]' \
            "$RUNNER_TEMP/bake-metadata.json")
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::no image digest in bake metadata"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest list
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "::error::expected 2 digests, got $#: $*"; exit 1; }
          refs=""
          for digest in "$@"; do refs="$refs $IMAGE@sha256:$digest"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "$IMAGE:$TAG" $refs

      - name: Verify platforms
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "::error::unexpected platform set: $platforms"
            exit 1
          fi
          echo "Published $IMAGE:$TAG ($platforms)" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote to latest
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:latest"
