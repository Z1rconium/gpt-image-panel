# Required validation for a commit. Runs on pushes and pull requests, and is
# called by release-image.yml so a tag cannot be built without the same checks
# passing on the same commit.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Same minor version as the Dockerfile runtime image.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Backend test suite
        run: python -m pytest backend/tests -q
      - name: Dependency consistency
        run: python -m pip check
      - name: Audit locked runtime dependencies
        run: pipx run pip-audit --require-hashes -r requirements.lock

  frontend:
    name: Frontend check, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run check:bundle
      - run: npm --prefix frontend run check:worker-build
      # The npm audit endpoint is occasionally unreachable from runners
      # (network timeout after hanging on the bulk-advisories request). Cap the
      # per-attempt timeout and retry so a transient registry error does not
      # fail the whole job. The command still exits non-zero when real audit
      # findings are reported, so retries cannot mask vulnerabilities.
      - name: Audit frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm --prefix frontend audit --fetch-timeout=90000; then
              exit 0
            fi
            echo "::warning::npm audit failed on attempt $attempt; retrying in 30s"
            sleep 30
          done
          echo "::error::npm audit failed after 3 attempts"
          exit 1

  e2e:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            specs: "agent access-settings"
          - shard: workspace
            specs: "markup-editor image-26 prompt-submit jobs-edit gallery-collections edit-mask"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # edit-mask.spec.ts shells out to backend/tests/support/browser_mask_coverage.py
      # (real backend admission), so the browser job needs the backend deps too.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      # The runner image already ships every Chromium system dependency, so
      # `--with-deps` would only re-run apt against the Ubuntu mirrors. A DNS
      # outage there (Temporary failure resolving 'azure.archive.ubuntu.com')
      # failed this step after ten minutes without touching the browser
      # download. Install the browser alone, retrying the CDN itself.
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            if npx --prefix frontend playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install failed on attempt $attempt; retrying in 15s"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      - name: Run Playwright shard (${{ matrix.shard }})
        env:
          PYTHON_EXECUTABLE: python
        run: npm --prefix frontend run test:e2e -- ${{ matrix.specs }}
