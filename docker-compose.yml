services:
  web:
    image: ${GPT_IMAGE_PANEL_IMAGE:-ghcr.io/z1rconium/gpt-image-linux:v1.8.0}
    container_name: gpt-image-panel-web
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./images:/app/images
      - ./data:/app/data
      - ./data/logs:/app/data/logs
    # Named entries forward only configured values from the project environment.
    environment:
      - DEFAULT_API_URL
      - DEFAULT_API_KEY
      - DEFAULT_API_PATH
      - DEFAULT_RESPONSES_MODEL
      - DEFAULT_UPSTREAM_SOCKS5_PROXY
      - APP_VERSION
      - GITHUB_REPO
      - ENABLE_VERSION_CHECK
      - ENABLE_METRICS
      - ENABLE_NGINX_ACCEL_REDIRECT
      - PUBLIC_IMAGE_BASE_URL
      - PUBLIC_THUMBNAIL_BASE_URL
      - GRANIAN_WORKERS
      - ALLOW_PLAINTEXT_SECRETS
      - ALLOW_LEGACY_ENV_REFS
      - PROMPT_OPTIMIZER_ENABLED
      - PROMPT_OPTIMIZER_API_URL
      - PROMPT_OPTIMIZER_API_KEY
      - PROMPT_OPTIMIZER_MODEL
      - PROMPT_OPTIMIZER_TIMEOUT_SECONDS
      - AI_ASSISTANT_ENABLED
      - AI_ASSISTANT_VISION_MODEL
      - R2_BACKUP_ENABLED
      - R2_ENDPOINT_URL
      - R2_BUCKET_NAME
      - R2_REGION
      - R2_KEY_PREFIX
      - R2_SYNC_INTERVAL_HOURS
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - NODEIMAGE_API_KEY
      - ACCESS_KEY
      - ALLOW_UNAUTHENTICATED
      - ACCESS_KEY_COOKIE_NAME
      - ACCESS_COOKIE_SECURE
      - ACCESS_MAX_FAILURES
      - ACCESS_LOCKOUT_SECONDS
      - ACCESS_GLOBAL_MAX_ATTEMPTS_PER_MINUTE
      - TURNSTILE_ENABLED
      - TURNSTILE_SITE_KEY
      - TURNSTILE_SECRET_KEY
      - IP_ALLOWLIST
      - TRUST_PROXY_HEADERS
      - TRUSTED_PROXY_IPS
      - PUBLIC_ORIGIN
      - ALLOWED_HOSTS
      - CSRF_ORIGIN_CHECK_ENABLED
      - UPSTREAM_USER_AGENT
      - WEBHOOK_SIGNING_SECRET
      - MAX_FILE_SIZE_MB
      - MASK_PASTE_BACK_DEFAULT
      - MAX_ACTIVE_GENERATE_JOBS
      - MAX_QUEUED_GENERATE_JOBS
      - IMAGES_DIR
      - THUMBNAILS_DIR
      - MASKS_DIR
      - DATA_DIR
      - DATABASE_FILE
      - SECRET_REGISTRY_JSON
      - CDN_SIGNING_SECRET
      - CDN_URL_TTL_SECONDS
      - IMAGE_COST_RATES_JSON
      - LOG_DIR
      - LOG_LEVEL
      - LOG_RETENTION_HOURS
      - TURNSTILE_TIMEOUT_SECONDS
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
